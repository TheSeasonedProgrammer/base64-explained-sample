name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26] # 26 adds the Uint8Array.fromBase64 columns of the decoder table
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node tests/test.mjs

  python:
    runs-on: ubuntu-latest
    # Debian, for GNU coreutils base64: the decoder table's column is GNU's, and Ubuntu 26.04's base64 is uutils.
    container: python:3.14-slim
    steps:
      - uses: actions/checkout@v7
      - run: base64 --version | head -1
      - run: python tests/test.py
